# Push a tag v<version> equal to package.json "version": the job packs index.html + js/
# with react-host.json and icon.png into react-host-app.zip, checks that the tag matches the
# manifest and attaches the ZIP to the release (install it in React Host by the repo URL).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Manifest, icon, ZIP, validation, tag == v<manifest.version>
        run: node scripts/package.mjs --tag-from-env
      - name: Attach react-host-app.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Slay $TAG"
          gh release upload "$TAG" react-host-app.zip --clobber
